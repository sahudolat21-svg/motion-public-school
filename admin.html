<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Motion Public School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>.hidden { display: none !important; }</style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <!-- ADMIN LOGIN -->
    <div id="adminLoginScreen" class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 text-center border-t-4 border-red-600">
            <h2 class="text-xl font-bold uppercase tracking-wider mb-6">Admin Login</h2>
            <p id="admin-error-msg" class="hidden bg-red-100 text-red-700 p-2 rounded mb-4 text-sm font-bold">Galat Details!</p>
            <input type="text" id="adminUser" class="w-full px-4 py-3 bg-slate-50 border rounded-lg mb-4 outline-none" placeholder="Username">
            <input type="password" id="adminPass" class="w-full px-4 py-3 bg-slate-50 border rounded-lg mb-6 outline-none" placeholder="Password">
            <button onclick="adminLogin()" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg shadow-lg">Login</button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="hidden max-w-6xl mx-auto p-6 space-y-6">
        <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border">
            <h1 class="text-2xl font-bold text-indigo-900"><i class="fa-solid fa-user-shield mr-2"></i> Admin Control Center</h1>
            <div class="flex space-x-3">
                <button onclick="openLiveWatchModal()" class="bg-indigo-600 text-white px-4 py-2 rounded font-bold"><i class="fa-solid fa-eye mr-1"></i> Live Devices (<span id="liveCount">0</span>)</button>
                <button onclick="logoutAdmin()" class="bg-red-100 text-red-700 px-4 py-2 rounded font-bold">Logout</button>
            </div>
        </div>

        <!-- NAVIGATION TABS -->
        <div class="flex space-x-3 bg-white p-3 rounded-xl shadow-sm border">
            <button onclick="switchAdminTab('settingsTab')" id="btn-settingsTab" class="px-5 py-2.5 rounded-lg font-bold bg-indigo-900 text-white transition">Settings & Records</button>
            <button onclick="switchAdminTab('feeSetTab')" id="btn-feeSetTab" class="px-5 py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 transition">Fee Set</button>
            <button onclick="switchAdminTab('feeRecordTab')" id="btn-feeRecordTab" class="px-5 py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 transition">Fee Record</button>
        </div>

        <!-- TAB 1: SETTINGS & ADMISSION RECORDS -->
        <div id="tab-settingsTab" class="admin-tab space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h2 class="text-lg font-bold mb-4 text-indigo-900">School Settings</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="text-sm font-semibold">School Name</label><input type="text" id="setSchoolName" class="w-full px-3 py-2 border rounded"></div>
                    <div><label class="text-sm font-semibold">Staff Password</label><input type="text" id="setStaffPass" class="w-full px-3 py-2 border rounded"></div>
                </div>
                <button onclick="saveAllSettings()" class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded font-bold">Save Settings</button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800">Manage Admissions</h2>
                    <button onclick="downloadAllAdmissionsPDF()" class="bg-emerald-600 text-white px-4 py-2 rounded font-bold text-sm">Download All Records PDF</button>
                </div>
                <select id="adminFilterClass" onchange="renderAdminData()" class="px-4 py-2 border rounded mb-4 bg-white">
                    <option value="">-- Choose Class --</option>
                    <option value="Nursery">Nursery</option><option value="LKG">LKG</option><option value="UKG">UKG</option>
                    <option value="1st">1st</option><option value="2nd">2nd</option><option value="3rd">3rd</option>
                    <option value="4th">4th</option><option value="5th">5th</option><option value="6th">6th</option>
                    <option value="7th">7th</option><option value="8th">8th</option><option value="9th">9th</option>
                    <option value="10th">10th</option><option value="11th">11th</option><option value="12th">12th</option>
                </select>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-100"><tr><th class="p-3">Roll</th><th class="p-3">Name</th><th class="p-3">Father Name</th><th class="p-3 text-center">Action</th></tr></thead>
                        <tbody id="adminTableBody" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 2: FEE SET -->
        <div id="tab-feeSetTab" class="admin-tab hidden bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h2 class="text-lg font-bold text-indigo-900"><i class="fa-solid fa-cogs mr-2"></i> Configure Default Class Fees</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label class="text-sm font-semibold">Select Class</label>
                    <select id="feeSetClass" class="w-full px-3 py-2 border rounded bg-white">
                        <option value="Nursery">Nursery</option><option value="1st">1st</option><option value="5th">5th</option><option value="10th">10th</option><option value="12th">12th</option>
                    </select>
                </div>
                <div><label class="text-sm font-semibold">Default Monthly Fee</label><input type="number" id="defaultMonthlyFee" class="w-full px-3 py-2 border rounded" value="1000"></div>
            </div>
            <button onclick="saveFeeStructure()" class="bg-emerald-600 text-white px-6 py-2 rounded font-bold">Save Fee Structure</button>
        </div>

        <!-- TAB 3: FEE RECORD -->
        <div id="tab-feeRecordTab" class="admin-tab hidden bg-white p-6 rounded-xl shadow-sm border space-y-4">
            <h2 class="text-lg font-bold text-indigo-900"><i class="fa-solid fa-file-invoice-dollar mr-2"></i> Monthly Fee Records (Class-wise)</h2>
            <select id="feeRecordClass" onchange="renderFeeRecordsList()" class="px-4 py-2 border rounded bg-white">
                <option value="">-- Select Class --</option>
                <option value="Nursery">Nursery</option><option value="1st">1st</option><option value="5th">5th</option><option value="10th">10th</option><option value="12th">12th</option>
            </select>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-100"><tr><th class="p-3">Roll</th><th class="p-3">Student Name</th><th class="p-3">Status / Months</th><th class="p-3 text-center">Action</th></tr></thead>
                    <tbody id="feeRecordTableBody" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- LIVE WATCH MODAL -->
    <div id="liveWatchModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-xl font-bold text-indigo-900">Active Connected Devices</h3>
                <button onclick="document.getElementById('liveWatchModal').classList.add('hidden')" class="text-xl font-bold">&times;</button>
            </div>
            <div id="liveSessionsList" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        (function() { emailjs.init("7_cYWCxamrOZ9dq7V"); })();
        const JSONBIN_BIN_ID = "6ab3e3a0ac6210605aed6c4b";
        const JSONBIN_API_KEY = "$2a$10$yyc9hu99dDO8hxlNRqiu4eao2Pa7kAKyCv6VTZk9o6MXaTNGh6mvO";

        let admissions = JSON.parse(localStorage.getItem('mps_admissions_v3')) || [];
        let activeSessions = {};
        const myAdminSession = 'admin_' + Math.random().toString(36).substring(2);

        async function syncCloud() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
                let data = await res.json();
                if(data && data.record) {
                    if(data.record.admissions) { admissions = data.record.admissions; localStorage.setItem('mps_admissions_v3', JSON.stringify(admissions)); }
                    if(data.record.activeSessions) activeSessions = data.record.activeSessions;
                }
            } catch(e) {}
        }

        setInterval(async () => {
            activeSessions[myAdminSession] = { time: Date.now(), role: 'Admin', device: 'Admin PC' };
            document.getElementById('liveCount').innerText = Object.keys(activeSessions).length;
            await saveCloudSessions();
        }, 5000);

        async function saveCloudSessions() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
                let data = await res.json();
                let rec = data.record || {};
                rec.activeSessions = activeSessions;
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
                    body: JSON.stringify(rec)
                });
            } catch(e) {}
        }

        function openLiveWatchModal() {
            let list = document.getElementById('liveSessionsList'); list.innerHTML = "";
            Object.keys(activeSessions).forEach((k, i) => {
                let isMe = k === myAdminSession ? " (You)" : "";
                list.innerHTML += `<div class="flex justify-between items-center p-2 border rounded"><span>Device #${i+1}${isMe} - ${activeSessions[k].role}</span> ${k !== myAdminSession ? `<button onclick="forceLogout('${k}')" class="bg-red-600 text-white px-2 py-1 rounded text-xs font-bold">Force Logout</button>` : ''}</div>`;
            });
            document.getElementById('liveWatchModal').classList.remove('hidden');
        }

        async function forceLogout(sid) {
            if(activeSessions[sid]) { activeSessions[sid].forceLogout = true; await saveCloudSessions(); openLiveWatchModal(); alert("Logged out!"); }
        }

        function adminLogin() {
            if(document.getElementById("adminUser").value === (localStorage.getItem('mps_actualAdminUser') || "rp sir") && document.getElementById("adminPass").value === (localStorage.getItem('mps_actualAdminPass') || "rp sir mps")) {
                document.getElementById("adminLoginScreen").classList.add("hidden");
                document.getElementById("adminDashboard").classList.remove("hidden");
                syncCloud().then(() => renderAdminData());
            } else { document.getElementById("admin-error-msg").classList.remove("hidden"); }
        }
        function logoutAdmin() { location.reload(); }

        function switchAdminTab(tabId) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            ['settingsTab', 'feeSetTab', 'feeRecordTab'].forEach(id => {
                let btn = document.getElementById('btn-' + id);
                if(id === tabId) { btn.className = "px-5 py-2.5 rounded-lg font-bold bg-indigo-900 text-white transition"; }
                else { btn.className = "px-5 py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 transition"; }
            });
            if(tabId === 'feeRecordTab') renderFeeRecordsList();
        }

        function renderAdminData() {
            let cls = document.getElementById('adminFilterClass').value;
            let tb = document.getElementById('adminTableBody'); tb.innerHTML = "";
            if(!cls) { tb.innerHTML = `<tr><td colspan="4" class="p-3 text-center">Select class</td></tr>`; return; }
            admissions.filter(a => a.cls === cls).forEach((a, i) => {
                let realIdx = admissions.indexOf(a);
                tb.innerHTML += `<tr><td class="p-3">${a.roll}</td><td class="p-3 font-semibold">${a.name}</td><td class="p-3">${a.fname||'-'}</td><td class="p-3 text-center"><button onclick="generateSlip(${realIdx})" class="bg-amber-100 text-amber-700 px-3 py-1 rounded font-bold">PDF</button></td></tr>`;
            });
        }

        function renderFeeRecordsList() {
            let cls = document.getElementById('feeRecordClass').value;
            let tb = document.getElementById('feeRecordTableBody'); tb.innerHTML = "";
            if(!cls) { tb.innerHTML = `<tr><td colspan="4" class="p-3 text-center">Select class</td></tr>`; return; }
            admissions.filter(a => a.cls === cls).forEach((a, i) => {
                let idx = admissions.indexOf(a);
                tb.innerHTML += `<tr><td class="p-3">${a.roll}</td><td class="p-3 font-semibold">${a.name}</td><td class="p-3 text-emerald-700 font-bold">Month: ${a.month} (Paid)</td><td class="p-3 text-center"><button onclick="generateSlip(${idx})" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded font-bold"><i class="fa-solid fa-eye mr-1"></i> View & PDF</button></td></tr>`;
            });
        }

        function saveFeeStructure() { alert("Class Fee Structure Saved Successfully!"); }
        function loadSettings() { document.getElementById('setSchoolName').value = localStorage.getItem('mps_schoolName') || "Motion Public School"; }
        async function saveAllSettings() {
            localStorage.setItem('mps_schoolName', document.getElementById('setSchoolName').value);
            alert("Settings Saved!");
        }

        function generateSlip(index) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4'); const d = admissions[index];
            doc.rect(10, 10, 190, 277); doc.rect(12, 12, 186, 273);
            doc.setFont("times", "bold"); doc.setFontSize(28); doc.text(localStorage.getItem('mps_schoolName') || "Motion Public School", 105, 25, {align: 'center'});
            doc.autoTable({
                startY: 45, theme: 'grid', styles: { font: 'times', fontSize: 11 },
                body: [
                    ['Student Name', d.name, 'Roll No', d.roll],
                    ['Father Name', d.fname, 'Class', d.cls],
                    ['Monthly Fee', d.v.m, 'Month', d.month],
                    [{content: 'Total Amount', styles: {fontStyle: 'bold'}}, {content: d.v.final, colSpan: 3, styles: {fontStyle: 'bold'}}]
                ]
            });
            let finalY = doc.lastAutoTable.finalY + 15;
            doc.text("Parents Signature..................", 20, finalY); doc.text("Accountant Sign..................", 130, finalY);
            if(d.parentSig) doc.addImage(d.parentSig, 'PNG', 25, finalY - 14, 40, 12);
            if(d.accSig) doc.addImage(d.accSig, 'PNG', 135, finalY - 14, 40, 12);
            doc.save(`FeeSlip_${d.name}.pdf`);
        }
    </script>
</body>
</html>
