<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Public School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>.hidden { display: none !important; }</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden p-8 text-center">
            <h1 class="text-2xl font-bold text-indigo-900 uppercase tracking-wider mb-6">Staff Login</h1>
            <p id="error-msg" class="hidden bg-red-100 text-red-700 p-2 rounded mb-4 text-sm">Galat Details!</p>
            <input type="text" id="username" class="w-full px-4 py-3 bg-slate-50 border rounded-lg mb-4 outline-none" placeholder="Username">
            <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 border rounded-lg mb-6 outline-none" placeholder="Password">
            <button onclick="login()" class="w-full bg-indigo-900 text-white font-bold py-3 rounded-lg shadow-lg">Login</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden flex h-screen">
        <div class="w-72 bg-indigo-950 text-white flex flex-col z-10">
            <div class="p-6 border-b border-indigo-900/50 flex flex-col items-center">
                <!-- Dynamic Logo Controlled by Admin -->
                <img id="schoolLogo" src="https://via.placeholder.com/150" alt="Logo" class="w-20 h-20 bg-white rounded-full object-cover mb-3">
                <h2 class="text-lg font-bold text-center">Motion Public School</h2>
            </div>
            <div class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
                <button onclick="showSection('newAdmission')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-amber-500 text-indigo-950 font-bold"><i class="fa-solid fa-user-plus"></i><span>New Admission</span></button>
                <button onclick="showSection('admissionList'); renderAdmissions();" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-indigo-900"><i class="fa-solid fa-users"></i><span>Admission List</span></button>
            </div>
            <div class="p-4 border-t border-indigo-900/50">
                <button onclick="openMap()" class="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg mb-2"><i class="fa-solid fa-map-location-dot"></i><span>View Location</span></button>
                <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 px-4 py-2 text-red-400 hover:bg-indigo-900 rounded-lg"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
            <header class="bg-white shadow-sm px-8 py-5 border-b"><h2 class="text-2xl font-bold">Portal Access</h2></header>
            <main class="flex-1 overflow-y-auto p-8">
                
                <!-- NEW ADMISSION FORM -->
                <div id="newAdmission" class="section block max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border p-8">
                    <h3 class="text-xl font-bold mb-6">Admission & Fee Slip</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div><label class="block text-sm font-semibold mb-1">Student Name</label><input type="text" id="adName" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label class="block text-sm font-semibold mb-1">Father Name</label><input type="text" id="adFName" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label class="block text-sm font-semibold mb-1">Roll No</label><input type="text" id="adRoll" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label class="block text-sm font-semibold mb-1">Class</label><input type="text" id="adClass" class="w-full px-3 py-2 border rounded-lg" value="0"></div>
                        <div><label class="block text-sm font-semibold mb-1">Month</label><input type="text" id="adMonth" class="w-full px-3 py-2 border rounded-lg" placeholder="00"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6">
                        <div class="border p-4 rounded-lg bg-slate-50">
                            <h4 class="font-bold border-b pb-2 mb-4">Monthly fee Structor</h4>
                            <div class="space-y-3">
                                <div class="flex justify-between"><label class="text-sm">Monthly fee Amount</label><input type="number" id="f_m" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Registration Fee</label><input type="number" id="f_r" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Admission Fee</label><input type="number" id="f_a" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Annual Fee</label><input type="number" id="f_an" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Tution fee</label><input type="number" id="f_t" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between pt-2 border-t"><label class="font-bold">Total Pay</label><input type="number" id="f_pay" readonly class="w-1/3 px-2 py-1 border rounded bg-slate-200 font-bold" value="00"></div>
                                <div class="flex justify-between"><label class="font-bold">Total Due</label><input type="number" id="f_due" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                            </div>
                        </div>
                        <div class="border p-4 rounded-lg bg-slate-50">
                            <h4 class="font-bold border-b pb-2 mb-4">Extra Accessories</h4>
                            <div class="space-y-3">
                                <div class="flex justify-between"><label class="text-sm">Buss Fee</label><input type="number" id="f_bs" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Sport fee</label><input type="number" id="f_sp" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Caution Money</label><input type="number" id="f_c" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Development Fee</label><input type="number" id="f_d" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Library Fee</label><input type="number" id="f_l" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between"><label class="text-sm">Book</label><input type="number" id="f_bk" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="00"></div>
                                <div class="flex justify-between pt-2 border-t"><label class="font-bold">Total Extra</label><input type="number" id="f_ext" readonly class="w-1/3 px-2 py-1 border rounded bg-slate-200 font-bold" value="00"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-emerald-100 p-4 rounded-lg flex justify-between items-center border mb-6">
                        <h3 class="font-bold text-emerald-900">Total Fee Amount</h3>
                        <input type="number" id="f_final" readonly class="bg-transparent text-right font-bold text-emerald-800 text-2xl w-32 outline-none" value="00">
                    </div>
                    <button onclick="saveAdmission()" class="w-full bg-indigo-900 text-white py-3 rounded-lg font-bold shadow-lg">Save Record</button>
                </div>

                <!-- ADMISSION LIST -->
                <div id="admissionList" class="section hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <div class="px-8 py-5 border-b bg-slate-50"><h3 class="text-xl font-bold">Records</h3></div>
                    <table class="w-full text-left">
                        <thead class="bg-slate-100 text-slate-600 text-sm"><tr><th class="p-4">Name</th><th class="p-4">Class</th><th class="p-4 text-center">Action</th></tr></thead>
                        <tbody id="adTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <script>
        let admissions = JSON.parse(localStorage.getItem('mps_admissions_v3')) || [];
        
        // Load Settings from Admin
        let logo = localStorage.getItem('mps_logo');
        if(logo) document.getElementById('schoolLogo').src = logo;
        function openMap() {
            let map = localStorage.getItem('mps_map');
            if(map) window.open(map, '_blank'); else alert("Map link not set in Admin Panel.");
        }

        // Login & UI
        function login() {
            if(document.getElementById("username").value === "Motion Public School" && document.getElementById("password").value === "MPS 752040") {
                document.getElementById("loginScreen").classList.add("hidden"); document.getElementById("dashboard").classList.remove("hidden");
            } else document.getElementById("error-msg").classList.remove("hidden");
        }
        function logout() { location.reload(); }
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Calculation & Save
        function calcAdTotal() {
            let g = (id) => Number(document.getElementById(id).value) || 0;
            let pay = g('f_m') + g('f_r') + g('f_a') + g('f_an') + g('f_t');
            let ext = g('f_bs') + g('f_sp') + g('f_c') + g('f_d') + g('f_l') + g('f_bk');
            document.getElementById('f_pay').value = pay; document.getElementById('f_ext').value = ext;
            document.getElementById('f_final').value = pay + ext;
        }

        function saveAdmission() {
            let data = {
                date: new Date().toLocaleDateString('en-GB'),
                name: document.getElementById("adName").value, fname: document.getElementById("adFName").value,
                roll: document.getElementById("adRoll").value, cls: document.getElementById("adClass").value,
                month: document.getElementById("adMonth").value, due: document.getElementById("f_due").value,
                v: {
                    m: document.getElementById("f_m").value, r: document.getElementById("f_r").value, a: document.getElementById("f_a").value,
                    an: document.getElementById("f_an").value, t: document.getElementById("f_t").value, pay: document.getElementById("f_pay").value,
                    bs: document.getElementById("f_bs").value, sp: document.getElementById("f_sp").value, c: document.getElementById("f_c").value,
                    d: document.getElementById("f_d").value, l: document.getElementById("f_l").value, bk: document.getElementById("f_bk").value,
                    ext: document.getElementById("f_ext").value, final: document.getElementById("f_final").value
                }
            };
            if(!data.name) return alert("Enter Student Name!");
            admissions.push(data);
            localStorage.setItem('mps_admissions_v3', JSON.stringify(admissions));
            alert("Saved!");
            document.querySelectorAll('#newAdmission input').forEach(i => i.value = i.type==='number'?'00':'');
        }

        function renderAdmissions() {
            let tb = document.getElementById("adTableBody"); tb.innerHTML = "";
            admissions.forEach((ad, i) => {
                tb.innerHTML += `<tr class="hover:bg-slate-50"><td class="p-4">${ad.name}</td><td class="p-4">${ad.cls}</td>
                <td class="p-4 text-center"><button onclick="generateSlip(${i})" class="bg-amber-100 text-amber-700 px-3 py-1 rounded font-bold"><i class="fa-solid fa-download"></i> PDF</button></td></tr>`;
            });
        }

        // PDF Generation
        function generateSlip(index) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4'); const d = admissions[index];
            doc.rect(10, 10, 190, 277); doc.rect(12, 12, 186, 273);
            doc.setFont("times", "bold"); doc.setFontSize(32); doc.text("Motion Public School", 105, 30, {align: 'center'});
            doc.setFontSize(12); doc.setFont("times", "normal"); doc.text("add ;-Near of B.S College ,Gamharia Rod Singheshwar", 105, 38, {align: 'center'});
            doc.line(15, 42, 195, 42); doc.setFont("times", "italic"); doc.setFontSize(16); doc.text("SCHOOL FEE-SLIP", 105, 50, {align: 'center'});
            doc.line(15, 53, 195, 53); doc.line(15, 54, 195, 54);
            
            doc.autoTable({
                startY: 56, theme: 'grid', styles: { font: 'times', textColor: 0, lineColor: 0, lineWidth: 0.2, fontSize: 11 },
                body: [
                    ['Phone Pay-', '7520400029', '', `Dat.${d.date}`],
                    ['Student Name', d.name, 'Roll No', d.roll],
                    ['Father Name', d.fname, 'Class', d.cls],
                    [{content: 'Monthly fee Structor', colSpan: 2, styles: {fontStyle: 'bold', halign: 'center'}}, {content: 'Extra Accessories', colSpan: 2, styles: {fontStyle: 'bold', halign: 'center'}}],
                    ['Monthly fee Amount', d.v.m, 'Buss Fee', d.v.bs], ['Registration Fee', d.v.r, 'Sport fee', d.v.sp],
                    ['Admission Fee', d.v.a, 'Caution Money', d.v.c], ['Annual Fee', d.v.an, 'Development Fee', d.v.d],
                    ['Tution fee', d.v.t, 'Library Fee', d.v.l], ['', '', 'Book', d.v.bk],
                    [{content: 'Total Pay', styles: {fontStyle: 'bold'}}, {content: d.v.pay, styles: {fontStyle: 'bold'}}, '', ''],
                    [{content: 'Month', styles: {fontStyle: 'bold'}}, {content: d.month, styles: {fontStyle: 'bold'}}, '', ''],
                    [{content: 'Total Due Month', styles: {fontStyle: 'bold'}}, {content: d.due, styles: {fontStyle: 'bold'}}, {content: 'Total Extra', styles: {fontStyle: 'bold'}}, d.v.ext],
                    [{content: 'Total Fee Amount', colSpan: 2, styles: {fontStyle: 'bold', halign: 'center', fontSize: 14}}, {content: d.v.final, colSpan: 2, styles: {halign: 'center', fontStyle: 'bold', fontSize: 14}}]
                ]
            });
            let finalY = doc.lastAutoTable.finalY + 12; doc.setFontSize(12); doc.setFont("times", "bold");
            doc.text("Parents Signature................................", 15, finalY); doc.text("AccountantSig................................", 120, finalY);
            doc.save(`FeeSlip_${d.name}.pdf`);
        }
    </script>
</body>
</html>
