<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Public School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>.hidden { display: none !important; } ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden p-8 text-center border-t-4 border-indigo-900">
            <h1 id="loginTitleDisplay" class="text-2xl font-bold text-indigo-900 uppercase tracking-wider mb-6">STAFF LOGIN</h1>
            <p id="error-msg" class="hidden bg-red-100 text-red-700 p-2 rounded mb-4 text-sm font-bold">Galat Details!</p>
            <input type="text" id="username" class="w-full px-4 py-3 bg-slate-50 border rounded-lg mb-4 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Username">
            <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 border rounded-lg mb-6 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Password">
            <button onclick="login()" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded-lg shadow-lg transition-all">Login</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden flex h-screen">
        <div class="w-72 bg-indigo-950 text-white flex flex-col z-10 shadow-2xl">
            <div class="p-6 border-b border-indigo-900/50 flex flex-col items-center">
                <img id="schoolLogo" src="https://via.placeholder.com/150" alt="Logo" class="w-20 h-20 bg-white rounded-full object-cover mb-3 p-1">
                <h2 id="displaySchoolName1" class="text-lg font-bold text-center text-amber-500">Motion Public School</h2>
            </div>
            <div class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
                <button id="nav-newAdmission" onclick="showSection('newAdmission', this)" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-amber-500 text-indigo-950 font-bold transition-all"><i class="fa-solid fa-user-plus w-5"></i><span>New Admission</span></button>
                <button id="nav-admissionList" onclick="showSection('admissionList', this); renderAdmissions();" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-indigo-200 hover:bg-indigo-900 transition-all"><i class="fa-solid fa-users w-5"></i><span>Admission List</span></button>
            </div>
            <div class="p-4 border-t border-indigo-900/50">
                <button onclick="openMap()" class="w-full flex items-center justify-center space-x-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg mb-2 font-bold transition-all"><i class="fa-solid fa-map-location-dot"></i><span>View Location</span></button>
                <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 px-4 py-2 text-red-400 hover:bg-indigo-900 rounded-lg transition-all"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
            <header class="bg-white shadow-sm px-8 py-5 border-b flex justify-between items-center">
                <h2 id="displaySchoolName2" class="text-2xl font-bold text-slate-800">Motion Public School</h2>
                <span class="text-sm font-bold text-indigo-600 bg-indigo-100 px-3 py-1 rounded-full">Cloud Synced Portal</span>
            </header>
            <main class="flex-1 overflow-y-auto p-8">
                
                <!-- NEW ADMISSION FORM -->
                <div id="newAdmission" class="section block max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border p-8">
                    <h3 class="text-xl font-bold mb-6 border-b pb-2" id="formTitle">Admission & Fee Slip</h3>
                    <input type="hidden" id="editAdIndex" value="-1">
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
                        <div><label class="block text-sm font-semibold mb-1">Student Name</label><input type="text" id="adName" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"></div>
                        <div><label class="block text-sm font-semibold mb-1">Father Name</label><input type="text" id="adFName" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"></div>
                        <div><label class="block text-sm font-semibold mb-1">Roll No</label><input type="text" id="adRoll" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"></div>
                        <div><label class="block text-sm font-semibold mb-1">Class</label><input type="text" id="adClass" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"></div>
                        <div><label class="block text-sm font-semibold mb-1">Month</label><input type="text" id="adMonth" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6">
                        <div class="border p-4 rounded-lg bg-slate-50">
                            <h4 class="font-bold border-b pb-2 mb-4 text-indigo-900">Monthly fee Structure</h4>
                            <div class="space-y-3">
                                <div class="flex justify-between"><label class="text-sm font-semibold">Monthly fee Amount</label><input type="number" id="f_m" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Registration Fee</label><input type="number" id="f_r" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Admission Fee</label><input type="number" id="f_a" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Annual Fee</label><input type="number" id="f_an" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Tution fee</label><input type="number" id="f_t" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between pt-2 border-t"><label class="font-bold">Total Pay</label><input type="number" id="f_pay" readonly class="w-1/3 px-2 py-1 border rounded bg-slate-200 font-bold" value="0"></div>
                                <div class="flex justify-between"><label class="font-bold">Total Due</label><input type="number" id="f_due" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                            </div>
                        </div>
                        <div class="border p-4 rounded-lg bg-slate-50">
                            <h4 class="font-bold border-b pb-2 mb-4 text-indigo-900">Extra Accessories</h4>
                            <div class="space-y-3">
                                <div class="flex justify-between"><label class="text-sm font-semibold">Bus Fee</label><input type="number" id="f_bs" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Sport fee</label><input type="number" id="f_sp" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Caution Money</label><input type="number" id="f_c" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Development Fee</label><input type="number" id="f_d" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Library Fee</label><input type="number" id="f_l" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between"><label class="text-sm font-semibold">Book</label><input type="number" id="f_bk" oninput="calcAdTotal()" class="w-1/3 px-2 py-1 border rounded" value="0"></div>
                                <div class="flex justify-between pt-2 border-t"><label class="font-bold">Total Extra</label><input type="number" id="f_ext" readonly class="w-1/3 px-2 py-1 border rounded bg-slate-200 font-bold" value="0"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-emerald-100 p-4 rounded-lg flex justify-between items-center border border-emerald-200 mb-6">
                        <h3 class="font-bold text-emerald-900 text-lg">Total Fee Amount</h3>
                        <input type="number" id="f_final" readonly class="bg-transparent text-right font-bold text-emerald-800 text-2xl w-32 outline-none" value="0">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4 border-t mb-6 bg-slate-50 p-4 rounded-lg">
                        <div><label class="block text-sm font-bold mb-2 text-indigo-900"><i class="fa-solid fa-camera mr-2"></i>Student Photo</label><input type="file" accept="image/*" onchange="processImg(event, 'p')" class="text-sm"></div>
                        <div><label class="block text-sm font-bold mb-2 text-indigo-900"><i class="fa-solid fa-signature mr-2"></i>Parent's Signature</label><input type="file" accept="image/*" onchange="processImg(event, 'ps')" class="text-sm"></div>
                        <div><label class="block text-sm font-bold mb-2 text-indigo-900"><i class="fa-solid fa-signature mr-2"></i>Accountant's Signature</label><input type="file" accept="image/*" onchange="processImg(event, 'as')" class="text-sm"></div>
                    </div>

                    <button onclick="saveAdmission()" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white py-3 rounded-lg font-bold shadow-lg transition-all text-lg">Save Record & Sync</button>
                </div>

                <!-- ADMISSION LIST -->
                <div id="admissionList" class="section hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <div class="px-8 py-5 border-b bg-slate-50 flex justify-between items-center">
                        <h3 class="text-xl font-bold text-indigo-900">Cloud Records</h3>
                        <button onclick="renderAdmissions()" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded text-sm font-bold hover:bg-indigo-200"><i class="fa-solid fa-rotate mr-1"></i> Refresh</button>
                    </div>
                    <table class="w-full text-left">
                        <thead class="bg-slate-100 text-slate-600 text-sm"><tr><th class="p-4">Name</th><th class="p-4">Class</th><th class="p-4 text-center">Action</th></tr></thead>
                        <tbody id="adTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <script>
        const JSONBIN_BIN_ID = "6ab3e3a0ac6210605aed6c4b";
        const JSONBIN_API_KEY = "$2a$10$yyc9hu99dDO8hxlNRqiu4eao2Pa7kAKyCv6VTZk9o6MXaTNGh6mvO";

        // Pehle local storage se turant data uthao taaki zero delay ho
        let admissions = JSON.parse(localStorage.getItem('mps_admissions_v3')) || [];
        let t_p = "", t_ps = "", t_as = ""; 

        // UI ko turant local data se set karo
        applySettingsToUI();
        syncCloudDataInBackground();

        function applySettingsToUI() {
            let sName = localStorage.getItem('mps_schoolName') || "Motion Public School";
            let sTitle = localStorage.getItem('mps_loginTitle') || "STAFF LOGIN";
            let logo = localStorage.getItem('mps_logo');
            
            document.getElementById('displaySchoolName1').innerText = sName;
            document.getElementById('displaySchoolName2').innerText = sName;
            document.getElementById('loginTitleDisplay').innerText = sTitle;
            if(logo) document.getElementById('schoolLogo').src = logo;
        }

        // Background me cloud se sync karo taaki latest data mile
        async function syncCloudDataInBackground() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                let result = await response.json();
                if(result && result.record) {
                    if(result.record.admissions) {
                        admissions = result.record.admissions;
                        localStorage.setItem('mps_admissions_v3', JSON.stringify(admissions));
                    }
                    if(result.record.settings) {
                        let s = result.record.settings;
                        if(s.schoolName) localStorage.setItem('mps_schoolName', s.schoolName);
                        if(s.staffUser) localStorage.setItem('mps_staffUser', s.staffUser);
                        if(s.staffPass) localStorage.setItem('mps_staffPass', s.staffPass);
                        if(s.loginTitle) localStorage.setItem('mps_loginTitle', s.loginTitle);
                        if(s.map) localStorage.setItem('mps_map', s.map);
                        if(s.logo) localStorage.setItem('mps_logo', s.logo);
                    }
                    applySettingsToUI();
                }
            } catch (err) {
                console.log("Background sync skipped");
            }
        }

        async function saveCloudData() {
            localStorage.setItem('mps_admissions_v3', JSON.stringify(admissions));
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                let result = await response.json();
                let currentData = result.record || {};
                currentData.admissions = admissions;

                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(currentData)
                });
            } catch (err) {
                console.log("Cloud sync error");
            }
        }

        function openMap() {
            let map = localStorage.getItem('mps_map');
            if(map) window.open(map, '_blank'); else alert("Map link not set in Admin Panel.");
        }

        function login() {
            let sUser = localStorage.getItem('mps_staffUser') || "Motion Public School";
            let sPass = localStorage.getItem('mps_staffPass') || "MPS 752040";

            if(document.getElementById("username").value === sUser && document.getElementById("password").value === sPass) {
                document.getElementById("loginScreen").classList.add("hidden"); 
                document.getElementById("dashboard").classList.remove("hidden");
            } else {
                document.getElementById("error-msg").classList.remove("hidden");
            }
        }
        function logout() { location.reload(); }
        
        function showSection(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('bg-amber-500','text-indigo-950'); b.classList.add('text-indigo-200'); });
            if(btn) { btn.classList.remove('text-indigo-200'); btn.classList.add('bg-amber-500','text-indigo-950'); }
        }

        function processImg(e, type) {
            let file = e.target.files[0]; if(!file) return;
            let reader = new FileReader();
            reader.onload = function(ev) {
                let img = new Image();
                img.onload = function() {
                    let canvas = document.createElement('canvas'); let ctx = canvas.getContext('2d');
                    let scale = img.width > 400 ? 400 / img.width : 1;
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    let b64 = canvas.toDataURL('image/jpeg', 0.6);
                    if(type === 'p') t_p = b64; if(type === 'ps') t_ps = b64; if(type === 'as') t_as = b64;
                }; img.src = ev.target.result;
            }; reader.readAsDataURL(file);
        }

        function calcAdTotal() {
            let g = (id) => Number(document.getElementById(id).value) || 0;
            let pay = g('f_m') + g('f_r') + g('f_a') + g('f_an') + g('f_t');
            let ext = g('f_bs') + g('f_sp') + g('f_c') + g('f_d') + g('f_l') + g('f_bk');
            document.getElementById('f_pay').value = pay; document.getElementById('f_ext').value = ext;
            document.getElementById('f_final').value = pay + ext;
        }

        async function saveAdmission() {
            let data = {
                date: new Date().toLocaleDateString('en-GB'),
                name: document.getElementById("adName").value, fname: document.getElementById("adFName").value,
                roll: document.getElementById("adRoll").value, cls: document.getElementById("adClass").value,
                month: document.getElementById("adMonth").value, due: document.getElementById("f_due").value,
                v: {
                    m: document.getElementById("f_m").value, r: document.getElementById("f_r").value, a: document.getElementById("f_a").value,
                    an: document.getElementById("f_an").value, t: document.getElementById("f_t").value, pay: document.getElementById("f_pay").value,
                    bs: document.getElementById("f_bs").value, sp: document.getElementById("f_sp").value, c: document.getElementById("f_c").value,
                    d: document.getElementById("f_d").value, l: document.getElementById("f_l").value, bk: document.getElementById("f_bk").value,
                    ext: document.getElementById("f_ext").value, final: document.getElementById("f_final").value
                },
                photo: t_p, parentSig: t_ps, accSig: t_as
            };
            if(!data.name) return alert("Enter Student Name!");
            
            let i = document.getElementById("editAdIndex").value;
            if(i === "-1") admissions.push(data); else {
                if(!t_p) data.photo = admissions[i].photo; if(!t_ps) data.parentSig = admissions[i].parentSig; if(!t_as) data.accSig = admissions[i].accSig;
                admissions[i] = data; document.getElementById("editAdIndex").value = "-1";
                document.getElementById("formTitle").innerText = "Admission & Fee Slip";
            }
            
            alert("Saved Successfully!");
            document.querySelectorAll('#newAdmission input').forEach(i => { if(i.type !== 'hidden') i.value = i.type==='number'?'0':'' });
            t_p = ""; t_ps = ""; t_as = "";
            showSection('admissionList', document.getElementById('nav-admissionList')); renderAdmissions();
            await saveCloudData();
        }

        function renderAdmissions() {
            let tb = document.getElementById("adTableBody"); tb.innerHTML = "";
            if(admissions.length === 0) {
                tb.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">No records found.</td></tr>`;
                return;
            }
            admissions.forEach((ad, i) => {
                tb.innerHTML += `<tr class="hover:bg-slate-50"><td class="p-4 font-semibold">${ad.name}</td><td class="p-4">${ad.cls}</td>
                <td class="p-4 text-center space-x-2">
                    <button onclick="generateSlip(${i})" class="bg-amber-100 text-amber-700 px-3 py-1 rounded font-bold hover:bg-amber-500 hover:text-white transition-all"><i class="fa-solid fa-download"></i> PDF</button>
                </td></tr>`;
            });
        }

        function generateSlip(index) {
            let sName = localStorage.getItem('mps_schoolName') || "Motion Public School";
            const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4'); const d = admissions[index];
            doc.rect(10, 10, 190, 277); doc.rect(12, 12, 186, 273);
            doc.setFont("times", "bold"); doc.setFontSize(32); doc.text(sName, 105, 30, {align: 'center'});
            doc.setFontSize(12); doc.setFont("times", "normal"); doc.text("add ;-Near of B.S College ,Gamharia Rod Singheshwar", 105, 38, {align: 'center'});
            doc.line(15, 42, 195, 42); doc.setFont("times", "italic"); doc.setFontSize(16); doc.text("SCHOOL FEE-SLIP", 105, 50, {align: 'center'});
            doc.line(15, 53, 195, 53); doc.line(15, 54, 195, 54);
            
            doc.autoTable({
                startY: 56, theme: 'grid', styles: { font: 'times', textColor: 0, lineColor: 0, lineWidth: 0.2, fontSize: 11, minCellHeight: 8 },
                body: [
                    ['Phone Pay-', '7520400029', '', `Dat.${d.date}`],
                    ['Student Name', d.name, 'Roll No', d.roll],
                    ['Father Name', d.fname, 'Class', d.cls],
                    [{content: 'Monthly fee Structure', colSpan: 2, styles: {fontStyle: 'bold', halign: 'center', fontSize: 12}}, {content: 'Extra Accessories', colSpan: 2, styles: {fontStyle: 'bold', halign: 'center', fontSize: 12}}],
                    ['Monthly fee Amount', d.v.m, 'Bus Fee', d.v.bs], ['Registration Fee', d.v.r, 'Sport fee', d.v.sp],
                    ['Admission Fee', d.v.a, 'Caution Money', d.v.c], ['Annual Fee', d.v.an, 'Development Fee', d.v.d],
                    ['Tution fee', d.v.t, 'Library Fee', d.v.l], ['', '', 'Book', d.v.bk],
                    [{content: 'Total Pay', styles: {fontStyle: 'bold'}}, {content: d.v.pay, styles: {fontStyle: 'bold'}}, '', ''],
                    [{content: 'Month', styles: {fontStyle: 'bold'}}, {content: d.month, styles: {fontStyle: 'bold'}}, '', ''],
                    [{content: 'Total Due Month', styles: {fontStyle: 'bold'}}, {content: d.due, styles: {fontStyle: 'bold'}}, {content: 'Total Extra', styles: {fontStyle: 'bold'}}, d.v.ext],
                    [{content: 'Total Fee Amount', colSpan: 2, styles: {fontStyle: 'bold', halign: 'center', fontSize: 14}}, {content: d.v.final, colSpan: 2, styles: {halign: 'center', fontStyle: 'bold', fontSize: 14}}]
                ]
            });
            let finalY = doc.lastAutoTable.finalY + 12; doc.setFontSize(12); doc.setFont("times", "bold");
            doc.text("Parents Signature................................", 15, finalY); doc.text("AccountantSig................................", 120, finalY);
            
            if(d.photo) doc.addImage(d.photo, 'JPEG', 160, 15, 25, 30);
            if(d.parentSig) doc.addImage(d.parentSig, 'JPEG', 45, finalY - 12, 35, 12);
            if(d.accSig) doc.addImage(d.accSig, 'JPEG', 150, finalY - 12, 35, 12);
            
            doc.save(`FeeSlip_${d.name}.pdf`);
        }
    </script>
</body>
</html>
