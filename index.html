<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Public School</title>
    <!-- PDF banane ke liye library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        
        /* Premium Header */
        header { background-color: #0b2046; color: #f4b41a; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { font-size: 2.5rem; letter-spacing: 1px; }
        header p { color: #fff; font-size: 1.1rem; margin-top: 5px; }

        /* Login Screen */
        #loginScreen { height: 80vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #f4b41a; }
        .login-box h2 { margin-bottom: 20px; color: #0b2046; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button.btn-primary { width: 100%; padding: 12px; background: #f4b41a; color: #0b2046; border: none; border-radius: 5px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.btn-primary:hover { background: #dca014; }

        /* Dashboard */
        #dashboard { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        .nav-buttons { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        .nav-btn { padding: 12px 25px; background: #0b2046; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { background: #f4b41a; color: #0b2046; }

        /* Sections */
        .section { display: none; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .section.active { display: block; }
        .section h2 { color: #0b2046; border-bottom: 2px solid #f4b41a; padding-bottom: 10px; margin-bottom: 20px; }

        /* Forms */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group.full { grid-column: span 2; }
        .submit-btn { padding: 12px 30px; background: #0b2046; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1rem; margin-top: 15px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #0b2046; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .download-btn { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
        .download-btn:hover { background: #218838; }

        #error-msg { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>MOTION PUBLIC SCHOOL</h1>
        <p>Singheshwar, Near B.S College</p>
    </header>

    <!-- Login System -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>School Login</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter Username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password">
            </div>
            <button class="btn-primary" onclick="login()">Login</button>
            <p id="error-msg">Galat Username ya Password!</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard">
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showSection('newAdmission')">New Admission</button>
            <button class="nav-btn" onclick="showSection('admissionList'); renderAdmissions();">Admission List</button>
            <button class="nav-btn" onclick="showSection('monthlyFee')">Monthly Fee</button>
            <button class="nav-btn" onclick="showSection('feeList'); renderFees();">Fee List</button>
            <button class="nav-btn" style="background: red; color: white;" onclick="logout()">Logout</button>
        </div>

        <!-- 1. New Admission Form -->
        <div id="newAdmission" class="section active">
            <h2>Student Admission Form</h2>
            <div class="form-grid">
                <div class="form-group"><label>Student Name</label><input type="text" id="adName"></div>
                <div class="form-group"><label>Father's Name</label><input type="text" id="adFName"></div>
                <div class="form-group"><label>Date of Birth</label><input type="date" id="adDob"></div>
                <div class="form-group"><label>Class</label>
                    <select id="adClass">
                        <option>Nursery</option><option>LKG</option><option>UKG</option>
                        <option>Class 1</option><option>Class 2</option><option>Class 3</option>
                        <option>Class 4</option><option>Class 5</option><option>Class 6</option>
                        <option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option>
                    </select>
                </div>
                <div class="form-group"><label>Mobile Number</label><input type="text" id="adMobile"></div>
                <div class="form-group"><label>Admission Fee (₹)</label><input type="number" id="adFee"></div>
                <div class="form-group full"><label>Address</label><input type="text" id="adAddress"></div>
            </div>
            <button class="submit-btn" onclick="saveAdmission()">Submit Admission</button>
        </div>

        <!-- 2. Admission List -->
        <div id="admissionList" class="section">
            <h2>Total Admissions</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Father's Name</th>
                        <th>Class</th>
                        <th>Mobile</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adTableBody"></tbody>
            </table>
        </div>

        <!-- 3. Monthly Fee Form -->
        <div id="monthlyFee" class="section">
            <h2>Pay Monthly Fee</h2>
            <div class="form-grid">
                <div class="form-group"><label>Student Name</label><input type="text" id="feeName"></div>
                <div class="form-group"><label>Class</label><input type="text" id="feeClass"></div>
                <div class="form-group"><label>Month</label>
                    <select id="feeMonth">
                        <option>January</option><option>February</option><option>March</option><option>April</option>
                        <option>May</option><option>June</option><option>July</option><option>August</option>
                        <option>September</option><option>October</option><option>November</option><option>December</option>
                    </select>
                </div>
                <div class="form-group"><label>Amount Paid (₹)</label><input type="number" id="feeAmount"></div>
            </div>
            <button class="submit-btn" onclick="saveFee()">Submit Fee</button>
        </div>

        <!-- 4. Fee List -->
        <div id="feeList" class="section">
            <h2>Fee Collection List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Month</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="feeTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Data Storage (Local Storage so data stays after refresh)
        let admissions = JSON.parse(localStorage.getItem('admissions')) || [];
        let fees = JSON.parse(localStorage.getItem('fees')) || [];

        // --- LOGIN SYSTEM ---
        function login() {
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            if (user === "Motion Public School" && pass === "MPS 752040") {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function logout() {
            document.getElementById("loginScreen").style.display = "flex";
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

        // --- NAVIGATION ---
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        // --- ADMISSION LOGIC ---
        function saveAdmission() {
            let adData = {
                date: new Date().toLocaleDateString(),
                name: document.getElementById("adName").value,
                fname: document.getElementById("adFName").value,
                dob: document.getElementById("adDob").value,
                cls: document.getElementById("adClass").value,
                mob: document.getElementById("adMobile").value,
                fee: document.getElementById("adFee").value,
                addr: document.getElementById("adAddress").value
            };
            if(!adData.name) return alert("Please enter name!");
            
            admissions.push(adData);
            localStorage.setItem('admissions', JSON.stringify(admissions));
            alert("Admission Saved Successfully!");
            
            // Clear fields
            document.querySelectorAll('#newAdmission input').forEach(inpt => inpt.value = '');
        }

        function renderAdmissions() {
            let tbody = document.getElementById("adTableBody");
            tbody.innerHTML = "";
            admissions.forEach((ad, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${ad.name}</td>
                        <td>${ad.fname}</td>
                        <td>${ad.cls}</td>
                        <td>${ad.mob}</td>
                        <td><button class="download-btn" onclick="generateAdmissionPDF(${index})">Download PDF</button></td>
                    </tr>
                `;
            });
        }

        // --- FEE LOGIC ---
        function saveFee() {
            let feeData = {
                date: new Date().toLocaleDateString(),
                name: document.getElementById("feeName").value,
                cls: document.getElementById("feeClass").value,
                month: document.getElementById("feeMonth").value,
                amt: document.getElementById("feeAmount").value
            };
            if(!feeData.name) return alert("Please enter name!");

            fees.push(feeData);
            localStorage.setItem('fees', JSON.stringify(fees));
            alert("Fee Saved Successfully!");
            
            document.querySelectorAll('#monthlyFee input').forEach(inpt => inpt.value = '');
        }

        function renderFees() {
            let tbody = document.getElementById("feeTableBody");
            tbody.innerHTML = "";
            fees.forEach((f, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${f.name}</td>
                        <td>${f.cls}</td>
                        <td>${f.month}</td>
                        <td>₹${f.amt}</td>
                        <td><button class="download-btn" onclick="generateFeePDF(${index})">Download PDF</button></td>
                    </tr>
                `;
            });
        }

        // --- PREMIUM PDF GENERATION ---
        function generateAdmissionPDF(index) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const data = admissions[index];

            // Header
            doc.setFillColor(11, 32, 70); // Deep Blue
            doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(244, 180, 26); // Gold
            doc.setFontSize(22);
            doc.setFont("helvetica", "bold");
            doc.text("MOTION PUBLIC SCHOOL", 105, 15, null, null, "center");
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(12);
            doc.text("Singheshwar, Near B.S College", 105, 23, null, null, "center");

            // Title
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(16);
            doc.text("ADMISSION RECEIPT & DETAILS", 105, 45, null, null, "center");
            doc.line(70, 48, 140, 48);

            // Table Data
            doc.autoTable({
                startY: 60,
                theme: 'grid',
                headStyles: { fillColor: [11, 32, 70], textColor: [255,255,255] },
                body: [
                    ['Admission Date', data.date],
                    ['Student Name', data.name],
                    ["Father's Name", data.fname],
                    ['Date of Birth', data.dob],
                    ['Class Admitted', data.cls],
                    ['Contact Number', data.mob],
                    ['Address', data.addr],
                    ['Admission Fee Paid', `Rs. ${data.fee}/-`]
                ]
            });

            // Footer
            doc.setFontSize(10);
            doc.text("Authorized Signature", 160, doc.lastAutoTable.finalY + 30);
            
            doc.save(`Admission_${data.name}.pdf`);
        }

        function generateFeePDF(index) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const data = fees[index];

            // Header
            doc.setFillColor(11, 32, 70);
            doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(244, 180, 26);
            doc.setFontSize(22);
            doc.setFont("helvetica", "bold");
            doc.text("MOTION PUBLIC SCHOOL", 105, 15, null, null, "center");
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(12);
            doc.text("Singheshwar, Near B.S College", 105, 23, null, null, "center");

            // Title
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(16);
            doc.text("MONTHLY FEE RECEIPT", 105, 45, null, null, "center");
            doc.line(70, 48, 140, 48);

            // Table Data
            doc.autoTable({
                startY: 60,
                theme: 'grid',
                headStyles: { fillColor: [11, 32, 70], textColor: [255,255,255] },
                body: [
                    ['Payment Date', data.date],
                    ['Student Name', data.name],
                    ['Class', data.cls],
                    ['Fee for Month', data.month],
                    ['Total Amount Paid', `Rs. ${data.amt}/-`]
                ]
            });

            // Footer
            doc.setFontSize(10);
            doc.text("Authorized Signature", 160, doc.lastAutoTable.finalY + 30);
            
            doc.save(`FeeReceipt_${data.name}_${data.month}.pdf`);
        }
    </script>
</body>
</html>
